<style>

    --loss:      #b91c1c;
    --loss-bg:   #fee2e2;
    --warn:      #b45309;

  [data-palette="paper"] {
    --bg:        #fafaf9;

  [data-density="compact"] { --pad: 14px; --gap: 12px; --radius: 10px; --radius-sm: 8px; }
  [data-density="spacious"] { --pad: 30px; --gap: 26px; --radius: 18px; --radius-sm: 14px; }

  html, body { height: 100%; }
  body {
    font-family: 'Geist', ui-sans-serif, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;

  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum"; }

  #root { min-height: 100vh; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }

  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input, select, textarea {
    font-family: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color-scheme: light dark;
  }
  [data-palette="dusk"] input, [data-palette="dusk"] select, [data-palette="dusk"] textarea { color-scheme: dark; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  [data-palette="dusk"] input::-webkit-calendar-picker-indicator { filter: invert(0.85); }

    background: var(--surface);

    font-size: 11px; font-weight: 600;
    letter-spacing: 0.02em;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-profit { background: var(--profit-bg); color: var(--profit); border-color: transparent; }
  .pill-loss   { background: var(--loss-bg);   color: var(--loss);   border-color: transparent; }
  .pill-warn   { background: var(--warn-bg);   color: var(--warn);   border-color: transparent; }
  .pill-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  @media (max-width: 900px) {

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// =============================================================================
// DATA FETCHING LAYER
// =============================================================================

function useApi(url, interval = 10000) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    let mounted = true;
    const load = () => fetch(url).then(r => r.json()).then(d => { if (mounted) setData(d); }).catch(e => { if (mounted) setError(e); });
    load();
    const t = setInterval(load, interval);
    return () => { mounted = false; clearInterval(t); };
  }, [url, interval]);
  return { data, error };
}

function useWebSocket() {
  const [connected, setConnected] = useState(false);
  const [lastTick, setLastTick] = useState(null);
  useEffect(() => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => setConnected(true);
    ws.onclose = () => setConnected(false);
    ws.onmessage = (e) => { try { setLastTick(JSON.parse(e.data)); } catch {} };
    return () => ws.close();
  }, []);
  return { connected, lastTick };
}

// =============================================================================
// SVG CHARTING
// =============================================================================

function EquitySpark({ data, height = 220, showAxis = true }) {
  const ref = useRef(null);
  const [width, setWidth] = useState(800);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => {
      const w = entries[0].contentRect.width;
      if (w > 0) setWidth(w);
    });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  const padL = showAxis ? 56 : 4, padR = 8, padT = 10, padB = showAxis ? 22 : 4;
  if (!data || data.length === 0) return <div ref={ref} style={{ width: '100%', height }} />;

  const ys = data.map(d => d.equity);
  const peaks = data.map(d => d.peak_equity || d.peak || d.equity);
  const min = Math.min(...ys, ...peaks) * 0.995;
  const max = Math.max(...ys, ...peaks) * 1.005;
  const xRange = data.length - 1;
  const sx = i => padL + (i / xRange) * (width - padL - padR);
  const sy = v => padT + (1 - (v - min) / (max - min)) * (height - padT - padB);

  const linePath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(d.equity).toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L ${sx(xRange)} ${height - padB} L ${sx(0)} ${height - padB} Z`;
  const peakPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(peaks[i]).toFixed(1)}`).join(' ');

  const last = data[data.length - 1];
  const isLoss = last.equity < data[0].equity;
  const lineColor = isLoss ? 'var(--loss)' : 'var(--accent)';
  const yTicks = [min, (min + max) / 2, max];

  return (
    <div ref={ref} style={{ width: '100%' }}>
    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      <defs>
        <linearGradient id="eqgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.18" />
          <stop offset="100%" stopColor={lineColor} stopOpacity="0" />
        </linearGradient>
      </defs>
      {showAxis && yTicks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={width - padR} y1={sy(t)} y2={sy(t)} stroke="var(--line-2)" strokeWidth="1" strokeDasharray={i === 1 ? '0' : '2 4'} />
          <text x={padL - 6} y={sy(t) + 3} fontSize="10" textAnchor="end" fill="var(--muted)" fontFamily="Geist Mono">€{t.toFixed(0)}</text>
        </g>
      ))}
      <path d={peakPath} fill="none" stroke="var(--faint)" strokeWidth="1" strokeDasharray="3 3" opacity="0.6" />
      <path d={areaPath} fill="url(#eqgrad)" />
      <path d={linePath} fill="none" stroke={lineColor} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={sx(xRange)} cy={sy(last.equity)} r="3.5" fill={lineColor} stroke="var(--surface)" strokeWidth="2" />
    </svg>
    </div>
  );
}

function Sparkline({ data, color, height = 28 }) {
  if (!data || data.length < 2) return null;
  const w = 110;
  const min = Math.min(...data) * 0.998;
  const max = Math.max(...data) * 1.002;
  const sx = i => (i / (data.length - 1)) * w;
  const sy = v => (1 - (v - min) / (max - min)) * height;
  const path = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(d).toFixed(1)}`).join(' ');
  const area = path + ` L ${w} ${height} L 0 ${height} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      <path d={area} fill={color} opacity="0.12" />
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" />
    </svg>
  );
}

function PriceChart({ bars, height = 360 }) {
  if (!bars || bars.length === 0) return null;
  const W = 1000;
  const padL = 8, padR = 56, padT = 8, padB = 22;
  const adxH = 60, volH = 50;
  const priceH = height - adxH - volH - padT - padB;

  const closes = bars.map(b => b.close);
  const highs = bars.map(b => b.high);
  const lows = bars.map(b => b.low);
  const min = Math.min(...lows) * 0.995;
  const max = Math.max(...highs) * 1.005;
  const xN = bars.length;
  const sx = i => padL + (i / (xN - 1)) * (W - padL - padR);
  const sy = v => padT + (1 - (v - min) / (max - min)) * priceH;
  const bw = Math.max(1.4, ((W - padL - padR) / xN) * 0.62);

  const dchUpPath = bars.filter(b => b.donchian_upper != null).map((b, idx) => {
    const i = bars.indexOf(b);
    return `${idx === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(b.donchian_upper).toFixed(1)}`;
  }).join(' ');
  const dchDnPath = bars.filter(b => b.donchian_lower != null).map((b, idx) => {
    const i = bars.indexOf(b);
    return `${idx === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(b.donchian_lower).toFixed(1)}`;
  }).join(' ');
  const emaPath = bars.filter(b => b.ema_200 != null).map((b, idx) => {
    const i = bars.indexOf(b);
    return `${idx === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(b.ema_200).toFixed(1)}`;
  }).join(' ');

  const upBars = bars.filter(b => b.donchian_upper != null && b.donchian_lower != null);
  const bandArea = upBars.length > 1 ? (
    upBars.map((b, idx) => { const i = bars.indexOf(b); return `${idx === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${sy(b.donchian_upper).toFixed(1)}`; }).join(' ')
    + ' ' + upBars.slice().reverse().map(b => { const i = bars.indexOf(b); return `L ${sx(i).toFixed(1)} ${sy(b.donchian_lower).toFixed(1)}`; }).join(' ') + ' Z'
  ) : '';

  const vols = bars.map(b => b.volume);
  const maxVol = Math.max(...vols);
  const volTop = padT + priceH + 6;
  const volBot = volTop + volH - 6;
  const volScale = v => volBot - (v / maxVol) * (volH - 12);

  const adxTop = volBot + 8;
  const adxBot = adxTop + adxH - 8;
  const adxScale = v => adxBot - (Math.min(60, v) / 60) * (adxH - 16);

  const last = bars[bars.length - 1];
  const isUp = last.close >= bars[0].close;

  return (
    <svg viewBox={`0 0 ${W} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const v = min + (max - min) * (1 - t);
        return (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={padT + t * priceH} y2={padT + t * priceH} stroke="var(--line-2)" strokeWidth="1" />
            <text x={W - padR + 6} y={padT + t * priceH + 3} fontSize="10" fill="var(--muted)" fontFamily="Geist Mono">{v.toFixed(0)}</text>
          </g>
        );
      })}
      {bandArea && <path d={bandArea} fill="var(--accent)" opacity="0.05" />}
      {dchUpPath && <path d={dchUpPath} fill="none" stroke="var(--accent)" strokeWidth="1" opacity="0.55" strokeDasharray="4 3" />}
      {dchDnPath && <path d={dchDnPath} fill="none" stroke="var(--accent)" strokeWidth="1" opacity="0.55" strokeDasharray="4 3" />}

      {bars.map((b, i) => {
        const up = b.close >= b.open;
        const color = up ? 'var(--profit)' : 'var(--loss)';
        const x = sx(i);
        const yo = sy(b.open), yc = sy(b.close);
        const yh = sy(b.high), yl = sy(b.low);
        const top = Math.min(yo, yc);
        const bh = Math.max(0.5, Math.abs(yc - yo));
        return (
          <g key={i}>
            <line x1={x} x2={x} y1={yh} y2={yl} stroke={color} strokeWidth="1" />
            <rect x={x - bw / 2} y={top} width={bw} height={bh} fill={color} />
          </g>
        );
      })}

      {emaPath && <path d={emaPath} fill="none" stroke="var(--ink-2)" strokeWidth="1.5" opacity="0.7" />}

      <line x1={padL} x2={W - padR} y1={sy(last.close)} y2={sy(last.close)} stroke={isUp ? 'var(--profit)' : 'var(--loss)'} strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
      <rect x={W - padR + 1} y={sy(last.close) - 8} width={padR - 2} height={16} fill={isUp ? 'var(--profit)' : 'var(--loss)'} rx="3" />
      <text x={W - padR / 2} y={sy(last.close) + 3} fontSize="10" textAnchor="middle" fill="white" fontFamily="Geist Mono" fontWeight="600">{last.close.toFixed(0)}</text>

      <g>
        <text x={padL} y={volTop + 12} fontSize="9" fill="var(--muted)" fontFamily="Geist Mono">VOL</text>
        {bars.map((b, i) => (
          <rect key={'v' + i} x={sx(i) - bw / 2} y={volScale(b.volume)} width={bw} height={Math.max(1, volBot - volScale(b.volume))} fill={b.close >= b.open ? 'var(--profit)' : 'var(--loss)'} opacity="0.45" />
        ))}
      </g>

      <g>
        <text x={padL} y={adxTop + 12} fontSize="9" fill="var(--muted)" fontFamily="Geist Mono">ADX(14)</text>
        <line x1={padL} x2={W - padR} y1={adxScale(25)} y2={adxScale(25)} stroke="var(--warn)" strokeWidth="1" strokeDasharray="2 3" opacity="0.6" />
        <text x={W - padR + 6} y={adxScale(25) + 3} fontSize="9" fill="var(--warn)" fontFamily="Geist Mono">25</text>
        <path d={bars.filter(b => b.adx != null).map((b, idx) => { const i = bars.indexOf(b); return `${idx === 0 ? 'M' : 'L'} ${sx(i).toFixed(1)} ${adxScale(b.adx).toFixed(1)}`; }).join(' ')} fill="none" stroke="var(--ink-2)" strokeWidth="1.5" />
      </g>
    </svg>
  );
}

// =============================================================================
// SHARED COMPONENTS
// =============================================================================

function StatusDot({ state }) {
  const color = state === 'killed' ? 'var(--loss)' : state === 'paused' ? 'var(--warn)' : 'var(--profit)';
  return <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: color, boxShadow: `0 0 0 3px ${color}22`, marginRight: 6 }} />;
}

function Money({ value, decimals = 2, signed = false }) {
  if (value == null || isNaN(value)) return <span className="num">—</span>;
  const sign = value < 0 ? '−' : (signed && value > 0 ? '+' : '');
  const abs = Math.abs(value);
  const formatted = abs.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return <span className="num">{sign}€{formatted}</span>;
}

function Pct({ value, signed = true, decimals = 2 }) {
  if (value == null || isNaN(value)) return <span>—</span>;
  const v = value * 100;
  const sign = v < 0 ? '−' : (signed && v > 0 ? '+' : '');
  return <span className="num">{sign}{Math.abs(v).toFixed(decimals)}%</span>;
}

function MetricCard({ label, children, accent, hint }) {
  return (
    <div className="card" style={{ padding: 'var(--pad)', display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</div>
      <div className="num" style={{ fontSize: 26, fontWeight: 600, letterSpacing: '-0.02em', color: accent || 'var(--ink)' }}>{children}</div>
      {hint && <div style={{ fontSize: 12, color: 'var(--muted)' }}>{hint}</div>}
    </div>
  );
}

function SectionHeader({ title, count, hint, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: '-0.01em' }}>{title}</h3>
        {count != null && <span className="pill" style={{ padding: '2px 8px', fontSize: 10 }}>{count}</span>}
        {hint && <span style={{ fontSize: 12, color: 'var(--muted)' }}>· {hint}</span>}
      </div>
      <div style={{ display: 'flex', gap: 6 }}>{children}</div>
    </div>
  );
}

function CoinIcon({ symbol, size = 32 }) {
  const sym = (symbol || '').replace('/EUR', '').toLowerCase();
  const fallbackBg = { btc: '#f7931a', eth: '#627eea', sol: '#00ffa3', xrp: '#23292f' }[sym] || '#666';
  const [errored, setErrored] = useState(false);
  if (errored) {
    return (
      <div style={{ width: size, height: size, borderRadius: '50%', background: fallbackBg, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: size * 0.42, fontWeight: 700, fontFamily: 'Geist Mono' }}>{(sym || '?')[0].toUpperCase()}</div>
    );
  }
  return (
    <img src={`https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/${sym}.svg`} alt={symbol} width={size} height={size} onError={() => setErrored(true)} style={{ width: size, height: size, borderRadius: '50%', background: '#fff', display: 'block', flexShrink: 0 }} />
  );
}

function Field({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: 10, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</div>
      <div className="num" style={{ fontWeight: 500, marginTop: 2 }}>{children}</div>
    </div>
  );
}

function EmptyState({ icon, title, text }) {
  return (
    <div style={{ padding: '40px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8, textAlign: 'center', color: 'var(--muted)' }}>
      <div style={{ fontSize: 36, opacity: 0.3, fontFamily: 'Geist Mono' }}>{icon}</div>
      <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-2)' }}>{title}</div>
      <div style={{ fontSize: 12, maxWidth: 280 }}>{text}</div>
    </div>
  );
}

// =============================================================================
// DASHBOARD SCREEN
// =============================================================================

function Dashboard({ status, equity, positions, signals, trades, circuitBreakers, onKill, killArmed, setKillArmed }) {
  const lastEq = status?.equity || 500;
  const startEq = equity && equity.length > 0 ? equity[0].equity : lastEq;
  const totalReturn = startEq > 0 ? (lastEq / startEq) - 1 : 0;
  const peakEq = equity && equity.length > 0 ? Math.max(...equity.map(e => e.peak_equity || e.equity)) : lastEq;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--gap)' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr 1fr', gap: 'var(--gap)' }}>
        <div className="card" style={{ padding: 'var(--pad)', display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Total equity</div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 6 }}>
                <span className="num" style={{ fontSize: 44, fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1 }}>€{lastEq.toFixed(2)}</span>
                <span className="num" style={{ fontSize: 14, fontWeight: 600, color: totalReturn >= 0 ? 'var(--profit)' : 'var(--loss)' }}>
                  {totalReturn >= 0 ? '↑' : '↓'} <Pct value={totalReturn} />
                </span>
              </div>
              <div style={{ marginTop: 4, fontSize: 12, color: 'var(--muted)' }}>from €{startEq.toFixed(2)} initial · peak €{peakEq.toFixed(2)}</div>
            </div>
            <div className="pill pill-accent" style={{ alignSelf: 'flex-start' }}><span className="pill-dot" />180D</div>
          </div>
          <div style={{ marginTop: 'auto' }}>
            <EquitySpark data={equity} height={140} showAxis={false} />
          </div>
        </div>

        <MetricCard label="Daily P&L" accent={(status?.daily_pnl || 0) >= 0 ? 'var(--profit)' : 'var(--loss)'} hint={<><Pct value={status?.daily_pnl_pct || 0} /> on session</>}>
          <Money value={status?.daily_pnl || 0} signed />
        </MetricCard>

        <MetricCard label="Drawdown" accent={(status?.open_risk_pct || 0) > 10 ? 'var(--loss)' : 'var(--ink)'} hint="from peak equity">
          <Pct value={equity && equity.length > 0 ? -(equity[equity.length - 1].drawdown_pct || 0) : 0} signed={false} decimals={1} />
        </MetricCard>

        <MetricCard label="Open risk" hint={`${(positions || []).length} of 3 slots in use`}>
          {(status?.open_risk_pct || 0).toFixed(2)}%
        </MetricCard>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 'var(--gap)', alignItems: 'stretch' }}>
        <div className="card" style={{ padding: 'var(--pad)' }}>
          <SectionHeader title="Open positions" count={(positions || []).length} hint="auto-managed by trailing stop">
            <span className="pill"><StatusDot state="ok" />trailing</span>
          </SectionHeader>
          {(!positions || positions.length === 0) ? (
            <EmptyState icon="○" title="No open positions" text="Bot is scanning for breakouts on the next 4h bar close." />
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 14 }}>
              {positions.map(p => <PositionRow key={p.symbol} pos={p} />)}
            </div>
          )}
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--gap)' }}>
          <CircuitBreakerCard cb={circuitBreakers} onKill={onKill} killArmed={killArmed} setKillArmed={setKillArmed} />
          <NextBarCard status={status} />
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 'var(--gap)' }}>
        <SignalLog signals={signals} />
        <RecentTrades trades={(trades || []).slice(0, 7)} />
      </div>
    </div>
  );
}

function PositionRow({ pos }) {
  const winning = (pos.unrealized_pnl || 0) >= 0;
  const sym = pos.symbol.split('/')[0];
  const r = pos.r_multiple || 0;
  return (
    <div style={{ padding: 14, borderRadius: 'var(--radius-sm)', background: 'var(--surface-2)', border: '1px solid var(--line)', display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <CoinIcon symbol={sym} />
          <div>
            <div style={{ fontWeight: 600, fontSize: 14 }}>{pos.symbol}</div>
            <div style={{ fontSize: 11, color: 'var(--muted)' }}>{pos.units} units · {pos.bars_in_trade} bars</div>
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="num" style={{ fontSize: 16, fontWeight: 600, color: winning ? 'var(--profit)' : 'var(--loss)' }}>
            <Money value={pos.unrealized_pnl} signed />
          </div>
          <div className="num" style={{ fontSize: 11, color: winning ? 'var(--profit)' : 'var(--loss)' }}>
            {r >= 0 ? '+' : ''}{r.toFixed(2)}R
          </div>
        </div>
      </div>

      <div>
        <div style={{ position: 'relative', height: 6, background: 'var(--line)', borderRadius: 3 }}>
          <div style={{ position: 'absolute', left: '25%', top: -3, bottom: -3, width: 1, background: 'var(--ink-2)', opacity: 0.5 }} />
          <div style={{ position: 'absolute', left: r >= 0 ? '25%' : `${25 + r * 25}%`, width: r >= 0 ? `${Math.min(r * 25, 75)}%` : `${-r * 25}%`, top: 0, bottom: 0, background: winning ? 'var(--profit)' : 'var(--loss)', borderRadius: 3 }} />
          <div style={{ position: 'absolute', left: `calc(${Math.max(0, Math.min(100, 25 + r * 25))}% - 6px)`, top: -3, width: 12, height: 12, borderRadius: '50%', background: winning ? 'var(--profit)' : 'var(--loss)', border: '2px solid var(--surface)' }} />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 10, color: 'var(--muted)', fontFamily: 'Geist Mono' }}>
          <span>−1R stop</span><span>0R entry</span><span>+1R</span><span>+2R</span><span>+3R</span>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, fontSize: 12, paddingTop: 8, borderTop: '1px solid var(--line)' }}>
        <Field label="Entry">€{pos.entry_price?.toFixed(2)}</Field>
        <Field label="Mark">€{pos.current_price?.toFixed(2)}</Field>
        <Field label="Stop">€{pos.stop_price?.toFixed(2)}</Field>
        <Field label="Bars in">{pos.bars_in_trade}</Field>
      </div>
    </div>
  );
}

function CircuitBreakerCard({ cb, onKill, killArmed, setKillArmed }) {
  if (!cb) return null;
  const status = cb.hard_kill ? 'killed' : cb.soft_pause ? 'paused' : 'ok';
  const statusText = status === 'killed' ? 'HARD KILL — bot stopped' : status === 'paused' ? 'SOFT PAUSE — drawdown limit hit' : 'All systems operational';
  const statusColor = status === 'killed' ? 'var(--loss)' : status === 'paused' ? 'var(--warn)' : 'var(--profit)';

  return (
    <div className="card" style={{ padding: 'var(--pad)' }}>
      <SectionHeader title="Circuit breakers">
        <span className="pill" style={{ background: status === 'killed' ? 'var(--loss-bg)' : status === 'paused' ? 'var(--warn-bg)' : 'var(--profit-bg)', color: statusColor, borderColor: 'transparent' }}>
          <span className="pill-dot" />{status === 'ok' ? 'green' : status}
        </span>
      </SectionHeader>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 14 }}>
        <CBRow label="Daily P&L" value={<Pct value={cb.daily_pnl_pct} />} threshold="−4%" violated={cb.daily_pnl_pct < -0.04} />
        <CBRow label="Consec losses" value={cb.consecutive_losses} threshold="6" violated={cb.consecutive_losses >= 6} />
        <CBRow label="Drawdown" value={<Pct value={-cb.drawdown_pct} signed={false} />} threshold="−10% / −20%" violated={cb.drawdown_pct >= 0.10} />
        <CBRow label="Bot state" value={status === 'ok' ? 'Running' : status === 'paused' ? 'Paused' : 'Killed'} />
      </div>

      <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: status === 'killed' ? 'var(--loss-bg)' : status === 'paused' ? 'var(--warn-bg)' : 'var(--profit-bg)', color: statusColor, fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 8 }}>
        <StatusDot state={status} />{statusText}
      </div>

      <div style={{ marginTop: 14, paddingTop: 14, borderTop: '1px solid var(--line)' }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 }}>Manual kill switch</div>
        {!killArmed ? (
          <button onClick={() => setKillArmed(true)} style={{ width: '100%', padding: '11px', borderRadius: 'var(--radius-sm)', background: 'var(--surface-2)', border: '1px solid var(--line)', fontSize: 13, fontWeight: 600, color: 'var(--ink-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
            <span style={{ fontFamily: 'Geist Mono' }}>⏻</span> Arm kill switch
          </button>
        ) : (
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={() => setKillArmed(false)} style={{ flex: 1, padding: '11px', borderRadius: 'var(--radius-sm)', background: 'var(--surface-2)', border: '1px solid var(--line)', fontSize: 13, fontWeight: 500, color: 'var(--ink-2)' }}>Cancel</button>
            <button onClick={onKill} style={{ flex: 2, padding: '11px', borderRadius: 'var(--radius-sm)', background: 'var(--loss)', border: 'none', fontSize: 13, fontWeight: 600, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
              <span style={{ fontFamily: 'Geist Mono' }}>⏻</span> Kill bot · close all
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function CBRow({ label, value, threshold, violated }) {
  return (
    <div style={{ padding: 12, borderRadius: 'var(--radius-sm)', background: violated ? 'var(--loss-bg)' : 'var(--surface-2)', border: '1px solid var(--line)' }}>
      <div style={{ fontSize: 10, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</div>
      <div className="num" style={{ fontSize: 16, fontWeight: 600, marginTop: 2, color: violated ? 'var(--loss)' : 'var(--ink)' }}>{value}</div>
      {threshold && <div className="num" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>limit {threshold}</div>}
    </div>
  );
}

function NextBarCard({ status }) {
  const [secs, setSecs] = useState(0);
  useEffect(() => {
    if (!status?.next_bar_time) return;
    const update = () => {
      const diff = Math.max(0, Math.floor((new Date(status.next_bar_time) - new Date()) / 1000));
      setSecs(diff);
    };
    update();
    const t = setInterval(update, 1000);
    return () => clearInterval(t);
  }, [status?.next_bar_time]);

  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  const total = 4 * 3600;
  const progress = 1 - secs / total;

  return (
    <div className="card" style={{ padding: 'var(--pad)' }}>
      <SectionHeader title="Next 4h bar close" />
      <div style={{ marginTop: 14 }}>
        <div className="num" style={{ fontSize: 32, fontWeight: 600, letterSpacing: '-0.02em' }}>
          {String(h).padStart(2,'0')}:{String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}
        </div>
        <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>bot will scan all pairs at close</div>
        <div style={{ marginTop: 12, height: 4, background: 'var(--line)', borderRadius: 2, overflow: 'hidden' }}>
          <div style={{ width: `${Math.max(0, progress * 100)}%`, height: '100%', background: 'var(--accent)', borderRadius: 2 }} />
        </div>
      </div>
    </div>
  );
}

function SignalLog({ signals }) {
  const typeColor = { entry_check: 'var(--profit)', exit_check: 'var(--loss)', regime_filter: 'var(--warn)', volume_confirm: 'var(--accent)' };
  if (!signals || signals.length === 0) return <div className="card" style={{ padding: 'var(--pad)' }}><SectionHeader title="Signal log" /><EmptyState icon="~" title="No signals yet" text="Signals will appear after the first bar scan." /></div>;
  return (
    <div className="card" style={{ padding: 'var(--pad)' }}>
      <SectionHeader title="Signal log" hint="recent decisions" />
      <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 320, overflowY: 'auto' }}>
        {signals.map((s, i) => (
          <div key={i} style={{ display: 'grid', gridTemplateColumns: '70px 60px 1fr', gap: 10, padding: '8px 4px', alignItems: 'baseline', borderBottom: '1px solid var(--line-2)', fontSize: 12 }}>
            <span style={{ fontSize: 9, fontWeight: 700, color: typeColor[s.signal_type] || 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{s.signal_type?.replace('_', ' ')}</span>
            <span className="mono" style={{ color: 'var(--ink-2)', fontSize: 11 }}>{s.symbol}</span>
            <span style={{ color: 'var(--ink-2)' }}>{s.reason}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function RecentTrades({ trades }) {
  if (!trades || trades.length === 0) return <div className="card" style={{ padding: 'var(--pad)' }}><SectionHeader title="Recent trades" /><EmptyState icon="≡" title="No trades yet" text="Trades will appear after the first position is closed." /></div>;
  return (
    <div className="card" style={{ padding: 'var(--pad)' }}>
      <SectionHeader title="Recent trades" hint="last closed" />
      <table style={{ width: '100%', marginTop: 12, fontSize: 12, borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ borderBottom: '1px solid var(--line)' }}>
            {['Pair','P&L','R','Reason'].map(h => (
              <th key={h} style={{ textAlign: 'left', padding: '8px 6px', fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {trades.map((t, i) => (
            <tr key={t.id || i} style={{ borderBottom: '1px solid var(--line-2)' }}>
              <td style={{ padding: '10px 6px', fontWeight: 500 }}>{t.symbol}</td>
              <td className="num" style={{ padding: '10px 6px', color: t.pnl >= 0 ? 'var(--profit)' : 'var(--loss)', fontWeight: 600 }}><Money value={t.pnl} signed /></td>
              <td className="num" style={{ padding: '10px 6px', color: t.r_multiple >= 0 ? 'var(--profit)' : 'var(--loss)' }}>{t.r_multiple >= 0 ? '+' : ''}{t.r_multiple?.toFixed(2)}R</td>
              <td style={{ padding: '10px 6px' }}><span className="pill" style={{ fontSize: 10, padding: '2px 8px' }}>{t.exit_reason}</span></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function ChartScreen({ chartBtc, chartEth }) {
  const [symbol, setSymbol] = useState('BTC');
  const bars = symbol === 'BTC' ? chartBtc : chartEth;
  if (!bars || bars.length === 0) return <div className="card" style={{ padding: 'var(--pad)' }}><EmptyState icon="◢" title="No chart data" text="Chart data will load after history is cached." /></div>;

  const last = bars[bars.length - 1];
  const first = bars[0];
  const chg = (last.close - first.close) / first.close;
  const high = Math.max(...bars.map(b => b.high));
  const low = Math.min(...bars.map(b => b.low));
  const isBullishTrend = last.ema_200 && last.close > last.ema_200;
  const breakoutDist = last.donchian_upper ? (last.close - last.donchian_upper) / last.donchian_upper : 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--gap)' }}>
      <div className="card" style={{ padding: 'var(--pad)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <CoinIcon symbol={symbol} />
            <div>
              <div style={{ display: 'flex', gap: 6, marginBottom: 2 }}>
                {['BTC','ETH'].map(s => (
                  <button key={s} onClick={() => setSymbol(s)} style={{ padding: '4px 10px', borderRadius: 6, fontSize: 12, fontWeight: 600, background: symbol === s ? 'var(--accent-soft)' : 'transparent', color: symbol === s ? 'var(--accent)' : 'var(--muted)', border: '1px solid ' + (symbol === s ? 'transparent' : 'var(--line)') }}>{s}/EUR</button>
                ))}
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
                <span className="num" style={{ fontSize: 30, fontWeight: 600, letterSpacing: '-0.02em' }}>€{last.close.toFixed(2)}</span>
                <span className="num" style={{ fontSize: 14, fontWeight: 600, color: chg >= 0 ? 'var(--profit)' : 'var(--loss)' }}>{chg >= 0 ? '↑' : '↓'} <Pct value={chg} /></span>
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 16, fontSize: 11, color: 'var(--muted)' }}>
            <Stat label="High" value={`€${high.toFixed(2)}`} />
            <Stat label="Low" value={`€${low.toFixed(2)}`} />
            <Stat label="EMA(200)" value={last.ema_200 ? `€${last.ema_200.toFixed(0)}` : '—'} accent={isBullishTrend ? 'var(--profit)' : 'var(--loss)'} />
            <Stat label="ADX(14)" value={last.adx ? last.adx.toFixed(1) : '—'} accent={last.adx > 25 ? 'var(--profit)' : 'var(--muted)'} />
          </div>
        </div>
        <div style={{ marginTop: 16 }}>
          <PriceChart bars={bars} height={440} />
        </div>
      </div>

      <div className="card" style={{ padding: 'var(--pad)' }}>
        <SectionHeader title="Strategy state" hint="Donchian breakout filter chain" />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginTop: 14 }}>
          <FilterCard label="Trend filter" check={isBullishTrend} value={`Close ${isBullishTrend ? '>' : '<'} EMA(200)`} sub={isBullishTrend ? 'bullish — entries enabled' : 'bearish — no entries'} />
          <FilterCard label="Trend strength" check={last.adx > 25} value={`ADX = ${last.adx?.toFixed(1) || '—'}`} sub={last.adx > 25 ? 'trending — pass' : 'weak — block'} />
          <FilterCard label="Breakout" check={breakoutDist > 0} value={`${(breakoutDist * 100).toFixed(2)}% vs upper`} sub={breakoutDist > 0 ? 'price broke out' : 'no breakout'} />
          <FilterCard label="Volume confirm" check={true} value="vol × 1.5 SMA" sub="confirmed" />
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, accent }) {
  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</div>
      <div className="num" style={{ fontSize: 14, fontWeight: 600, marginTop: 2, color: accent || 'var(--ink)' }}>{value}</div>
    </div>
  );
}

function FilterCard({ label, check, value, sub }) {
  return (
    <div style={{ padding: 14, borderRadius: 'var(--radius-sm)', background: check ? 'var(--profit-bg)' : 'var(--surface-2)', border: '1px solid ' + (check ? 'transparent' : 'var(--line)') }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
        <span style={{ width: 16, height: 16, borderRadius: '50%', background: check ? 'var(--profit)' : 'var(--faint)', color: '#fff', fontSize: 10, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{check ? '✓' : '×'}</span>
        <span style={{ fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</span>
      </div>
      <div className="num" style={{ fontSize: 14, fontWeight: 600, color: check ? 'var(--profit)' : 'var(--ink-2)' }}>{value}</div>
      <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{sub}</div>
    </div>
  );
}

function TradesScreen({ trades }) {
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('date');

  const filtered = useMemo(() => {
    if (!trades) return [];
    let arr = [...trades];
    if (filter === 'wins') arr = arr.filter(t => t.pnl > 0);
    if (filter === 'losses') arr = arr.filter(t => t.pnl <= 0);
    if (filter === 'btc') arr = arr.filter(t => t.symbol.includes('BTC'));
    if (filter === 'eth') arr = arr.filter(t => t.symbol.includes('ETH'));
    if (sort === 'pnl') arr.sort((a, b) => b.pnl - a.pnl);
    if (sort === 'r') arr.sort((a, b) => b.r_multiple - a.r_multiple);
    return arr;
  }, [trades, filter, sort]);

  if (!trades || trades.length === 0) return <div className="card" style={{ padding: 'var(--pad)' }}><EmptyState icon="≡" title="No trade history" text="Trades appear here after positions are closed." /></div>;

  const wins = trades.filter(t => t.pnl > 0).length;
  const winRate = wins / trades.length;
  const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
  const avgR = trades.reduce((s, t) => s + (t.r_multiple || 0), 0) / trades.length;
  const bestR = Math.max(...trades.map(t => t.r_multiple || 0));
  const worstR = Math.min(...trades.map(t => t.r_multiple || 0));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--gap)' }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 'var(--gap)' }}>
        <MetricCard label="Total trades">{trades.length}</MetricCard>
        <MetricCard label="Win rate" hint={`${wins} wins · ${trades.length - wins} losses`}>{(winRate * 100).toFixed(1)}%</MetricCard>
        <MetricCard label="Total P&L" accent={totalPnl >= 0 ? 'var(--profit)' : 'var(--loss)'}><Money value={totalPnl} signed /></MetricCard>
        <MetricCard label="Avg R" accent={avgR >= 0 ? 'var(--profit)' : 'var(--loss)'}>{avgR >= 0 ? '+' : ''}{avgR.toFixed(2)}R</MetricCard>
        <MetricCard label="Best / Worst R">
          <span style={{ color: 'var(--profit)' }}>+{bestR.toFixed(1)}</span>
          <span style={{ color: 'var(--muted)', fontWeight: 400 }}> / </span>
          <span style={{ color: 'var(--loss)' }}>{worstR.toFixed(1)}</span>
        </MetricCard>
      </div>

      <div className="card" style={{ padding: 'var(--pad)' }}>
        <SectionHeader title="R-multiple distribution" />
        <RDistribution trades={trades} />
      </div>

      <div className="card" style={{ padding: 'var(--pad)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <SectionHeader title="Trade history" count={filtered.length} />
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            {[['all','All'],['wins','Wins'],['losses','Losses'],['btc','BTC'],['eth','ETH']].map(([k, l]) => (

              <option value="date">Sort: date</option>
              <option value="pnl">Sort: P&L</option>
              <option value="r">Sort: R</option>
            </select>
          </div>
        </div>
        <table style={{ width: '100%', marginTop: 14, fontSize: 12, borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid var(--line)' }}>
              {['Pair','Entry','Exit','Units','P&L','R','Reason'].map(h => (
                <th key={h} style={{ textAlign: 'left', padding: '10px 8px', fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{h}</th>
              ))}

          </thead>
          <tbody>
            {filtered.map((t, i) => (
              <tr key={t.id || i} style={{ borderBottom: '1px solid var(--line-2)' }}>
                <td style={{ padding: '10px 8px', fontWeight: 500 }}>{t.symbol}</td>
                <td className="num" style={{ padding: '10px 8px' }}>€{t.entry_price?.toFixed(2)}</td>
                <td className="num" style={{ padding: '10px 8px' }}>€{t.exit_price?.toFixed(2)}</td>
                <td className="num" style={{ padding: '10px 8px', color: 'var(--muted)' }}>{t.units}</td>
                <td className="num" style={{ padding: '10px 8px', color: t.pnl >= 0 ? 'var(--profit)' : 'var(--loss)', fontWeight: 600 }}><Money value={t.pnl} signed /></td>
                <td className="num" style={{ padding: '10px 8px', color: (t.r_multiple || 0) >= 0 ? 'var(--profit)' : 'var(--loss)' }}>{(t.r_multiple || 0) >= 0 ? '+' : ''}{(t.r_multiple || 0).toFixed(2)}</td>
                <td style={{ padding: '10px 8px' }}><span className="pill" style={{ fontSize: 10, padding: '2px 8px' }}>{t.exit_reason}</span></td>

}

function RDistribution({ trades }) {
  const bins = {};
  for (let r = -2; r <= 4; r += 0.5) bins[r.toFixed(1)] = 0;
  trades.forEach(t => {
    const r = Math.round((t.r_multiple || 0) * 2) / 2;
    const k = Math.max(-2, Math.min(4, r)).toFixed(1);
    bins[k] = (bins[k] || 0) + 1;
  });
  const keys = Object.keys(bins).sort((a, b) => parseFloat(a) - parseFloat(b));
  const max = Math.max(...keys.map(k => bins[k]), 1);
  const w = 1000, h = 140;
  const bw = (w - 20) / keys.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, marginTop: 10 }}>
      {keys.map((k, i) => {
        const v = parseFloat(k);
        const bh = (bins[k] / max) * (h - 30);
        const x = 10 + i * bw;
        const y = h - 22 - bh;
        return (
          <g key={k}>
            <rect x={x + 2} y={y} width={bw - 4} height={bh} fill={v >= 0 ? 'var(--profit)' : 'var(--loss)'} opacity={Math.abs(v) < 0.1 ? 0.4 : 0.85} rx="2" />
            {bins[k] > 0 && <text x={x + bw / 2} y={y - 4} textAnchor="middle" fontSize="10" fill="var(--ink-2)" fontFamily="Geist Mono" fontWeight="600">{bins[k]}</text>}
            <text x={x + bw / 2} y={h - 6} textAnchor="middle" fontSize="10" fill="var(--muted)" fontFamily="Geist Mono">{v >= 0 ? '+' : ''}{v.toFixed(1)}R</text>
          </g>
        );
      })}
    </svg>
  );
}

// =============================================================================

// =============================================================================

function BacktestScreen() {
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [symbol, setSymbol] = useState('BTC/EUR');
  const [timeframe, setTimeframe] = useState('4h');
  const [start, setStart] = useState('2023-01-01');
  const [end, setEnd] = useState('');

  const run = async () => {
    setRunning(true); setError(null);
    try {
      const params = new URLSearchParams({ symbol, timeframe, start, end });
      const res = await fetch(`/api/backtest?${params}`, { method: 'POST' });
      const data = await res.json();
      if (data.error) { setError(data.error); } else { setResult(data); }
    } catch (e) { setError(e.message); }
    setRunning(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--gap)' }}>
      <div className="card" style={{ padding: 'var(--pad)' }}>
        <SectionHeader title="Run backtest" hint="against cached OHLCV history" />
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', flexWrap: 'wrap', marginTop: 14 }}>
          <Field2 label="Pair">
            <select value={symbol} onChange={e => setSymbol(e.target.value)}>
              <option>BTC/EUR</option><option>ETH/EUR</option><option>SOL/EUR</option><option>XRP/EUR</option>
            </select>
          </Field2>
          <Field2 label="Timeframe">
            <select value={timeframe} onChange={e => setTimeframe(e.target.value)}>
              <option value="4h">4h</option><option value="1d">1d</option>
            </select>
          </Field2>
          <Field2 label="Start">
            <input type="date" value={start} onChange={e => setStart(e.target.value)} />
          </Field2>
          <Field2 label="End">
            <input type="date" value={end} onChange={e => setEnd(e.target.value)} />
          </Field2>
          <button onClick={run} disabled={running} style={{ padding: '10px 22px', borderRadius: 'var(--radius-sm)', background: running ? 'var(--surface-2)' : 'var(--accent)', color: running ? 'var(--muted)' : 'var(--accent-fg)', fontWeight: 600, fontSize: 13 }}>
            {running ? 'Running...' : 'Run backtest →'}
          </button>
        </div>
        {error && <div style={{ marginTop: 12, padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'var(--loss-bg)', color: 'var(--loss)', fontSize: 12 }}>{error}</div>}
      </div>

      {result && (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 'var(--gap)' }}>
            <MetricCard label="Total return" accent="var(--profit)">+{result.metrics.total_return_pct?.toFixed(1)}%</MetricCard>
            <MetricCard label="Sharpe">{result.metrics.sharpe?.toFixed(2) || '—'}</MetricCard>
            <MetricCard label="Max drawdown" accent="var(--loss)">{result.metrics.max_drawdown_pct?.toFixed(1)}%</MetricCard>
            <MetricCard label="Win rate">{result.metrics.win_rate_pct?.toFixed(1)}%</MetricCard>
            <MetricCard label="Trades">{result.metrics.total_trades || result.trades?.length || 0}</MetricCard>
          </div>
          {result.equity_curve && result.equity_curve.length > 0 && (
            <div className="card" style={{ padding: 'var(--pad)' }}>
              <SectionHeader title="Backtest equity curve" hint={`${symbol} · ${timeframe} · ${result.trades?.length || 0} trades`} />
              <div style={{ marginTop: 14 }}>
                <EquitySpark data={result.equity_curve.map((eq, i) => ({ equity: eq, peak_equity: eq }))} height={280} />
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function Field2({ label, children }) {
  const child = React.Children.only(children);
  const styled = React.cloneElement(child, {
    style: { padding: '8px 12px', fontSize: 13, borderRadius: 'var(--radius-sm)', border: '1px solid var(--line)', background: 'var(--surface)', color: 'var(--ink)', fontFamily: 'Geist Mono', minWidth: 120, outline: 'none', ...(child.props.style || {}) },
  });
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</label>
      {styled}
    </div>
  );
}

// LAYOUT — SIDEBAR (default)
// =============================================================================

const NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: '◐' },
  { id: 'chart', label: 'Charts', icon: '◢' },
  { id: 'trades', label: 'Trades', icon: '≡' },
  { id: 'backtest', label: 'Backtest', icon: '↻' },
  { id: 'strategy', label: 'Strategy', icon: '☰' },
];

function Logo() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div style={{ width: 26, height: 26, borderRadius: 7, background: 'var(--accent)', color: 'var(--accent-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, fontFamily: 'Geist Mono', letterSpacing: '-0.05em' }}>A</div>
      <div>
        <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1 }}>autobot</div>
        <div style={{ fontSize: 9, color: 'var(--muted)', fontFamily: 'Geist Mono', letterSpacing: '0.04em' }}>v0.1 · kraken</div>
      </div>
    </div>
  );
}

function ModeBadge({ status }) {
  const killed = status?.health === 'killed';
  return (
    <span className="pill" style={{ background: killed ? 'var(--loss-bg)' : 'var(--warn-bg)', color: killed ? 'var(--loss)' : 'var(--warn)', borderColor: 'transparent' }}>
      <StatusDot state={killed ? 'killed' : 'ok'} />{status?.mode === 'live' ? 'LIVE' : killed ? 'STOPPED' : 'DRY-RUN'}
    </span>
  );
}

function Ticker({ symbol, bars }) {
  if (!bars || bars.length === 0) return null;
  const last = bars[bars.length - 1];
  const recent = bars.slice(-30).map(b => b.close);
  const first = recent[0];
  const chg = (last.close - first) / first;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '4px 6px', borderRadius: 8 }}>
      <CoinIcon symbol={symbol} size={28} />
      <div style={{ minWidth: 0, flex: '0 0 auto' }}>
        <div style={{ fontSize: 11, color: 'var(--ink)', fontWeight: 600, lineHeight: 1.1 }}>{symbol}/EUR</div>
        <div className="num" style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)', marginTop: 3, lineHeight: 1 }}>€{last.close.toFixed(0)}</div>
      </div>
      <div style={{ flex: 1, minWidth: 40, height: 24 }}>
        <Sparkline data={recent} color={chg >= 0 ? 'var(--profit)' : 'var(--loss)'} height={24} />
      </div>
      <div className="num" style={{ fontSize: 11, fontWeight: 600, color: chg >= 0 ? 'var(--profit)' : 'var(--loss)', textAlign: 'right', flex: '0 0 auto' }}>
        {chg >= 0 ? '↑' : '↓'}{(Math.abs(chg) * 100).toFixed(1)}%
      </div>
    </div>
  );
}

function KilledBanner({ onResume }) {
  return (
    <div style={{ padding: '10px 16px', background: 'var(--loss)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12, fontWeight: 500 }}>
      <span>⏻  Bot stopped. All positions force-closed at market.</span>
      <button onClick={onResume} style={{ padding: '5px 14px', borderRadius: 6, fontSize: 11, fontWeight: 600, background: 'rgba(255,255,255,0.18)', color: '#fff' }}>Resume</button>
    </div>
  );
}

// MAIN APP
// =============================================================================

function App() {
  const [route, setRoute] = useState('dashboard');
  const [killArmed, setKillArmed] = useState(false);

  const { data: status } = useApi('/api/status', 5000);
  const { data: equity } = useApi('/api/equity', 15000);
  const { data: positions } = useApi('/api/positions', 5000);
  const { data: trades } = useApi('/api/trades', 30000);
  const { data: signals } = useApi('/api/signals', 10000);
  const { data: circuitBreakers } = useApi('/api/circuit-breakers', 5000);
  const { data: chartBtc } = useApi('/api/chart/BTC', 30000);
  const { data: chartEth } = useApi('/api/chart/ETH', 30000);
  const { connected } = useWebSocket();

  const killed = status?.health === 'killed';

  const onKill = async () => {
    await fetch('/api/stop', { method: 'POST' });
    setKillArmed(false);
  };
  const onResume = async () => {
    await fetch('/api/resume', { method: 'POST' });
  };

  const screen =
    route === 'dashboard' ? <Dashboard status={status} equity={equity} positions={positions} signals={signals} trades={trades} circuitBreakers={circuitBreakers} onKill={onKill} killArmed={killArmed} setKillArmed={setKillArmed} /> :
    route === 'chart' ? <ChartScreen chartBtc={chartBtc} chartEth={chartEth} /> :
    route === 'trades' ? <TradesScreen trades={trades} /> :
    route === 'backtest' ? <BacktestScreen /> :
    route === 'strategy' ? <StrategyScreen /> :
    <Dashboard status={status} equity={equity} positions={positions} signals={signals} trades={trades} circuitBreakers={circuitBreakers} onKill={onKill} killArmed={killArmed} setKillArmed={setKillArmed} />;

  return (
    <div data-palette="dusk" data-density="balanced" data-layout="sidebar" style={{ minHeight: '100vh', background: 'var(--bg)', color: 'var(--ink)' }}>
      <div style={{ display: 'flex', minHeight: '100vh' }}>
        {/* Sidebar */}
        <aside style={{ width: 240, flexShrink: 0, background: 'var(--surface)', borderRight: '1px solid var(--line)', padding: '20px 14px', display: 'flex', flexDirection: 'column', gap: 18, position: 'sticky', top: 0, height: '100vh' }}>
          <div style={{ padding: '0 6px' }}><Logo /></div>

          <nav style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {NAV.map(n => (
              <button key={n.id} onClick={() => setRoute(n.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', borderRadius: 8, fontSize: 13, fontWeight: 500, background: route === n.id ? 'var(--accent-soft)' : 'transparent', color: route === n.id ? 'var(--accent)' : 'var(--ink-2)', textAlign: 'left' }}>
                <span style={{ fontFamily: 'Geist Mono', fontSize: 13, opacity: 0.8 }}>{n.icon}</span>
                {n.label}
              </button>
            ))}
          </nav>

          <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em', padding: '0 6px' }}>Live ticker</div>
            <div style={{ padding: '8px', background: 'var(--surface-2)', borderRadius: 'var(--radius-sm)' }}>
              <Ticker symbol="BTC" bars={chartBtc} />
            </div>
            <div style={{ padding: '8px', background: 'var(--surface-2)', borderRadius: 'var(--radius-sm)' }}>
              <Ticker symbol="ETH" bars={chartEth} />
            </div>
            <div style={{ padding: '8px 6px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 10, color: 'var(--muted)' }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: connected ? 'var(--profit)' : 'var(--loss)', boxShadow: connected ? '0 0 0 3px var(--profit-bg)' : '0 0 0 3px var(--loss-bg)' }} />
                <span style={{ fontFamily: 'Geist Mono' }}>{connected ? 'WS connected' : 'disconnected'}</span>
              </span>
            </div>
          </div>
        </aside>

        <div style={{ flex: 1, minWidth: 0 }}>
          {killed && <KilledBanner onResume={onResume} />}
          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 28px', borderBottom: '1px solid var(--line)', background: 'var(--surface)', position: 'sticky', top: 0, zIndex: 10 }}>
            <div>
              <div style={{ fontSize: 19, fontWeight: 600, letterSpacing: '-0.02em', textTransform: 'capitalize' }}>{route}</div>
              <div style={{ fontSize: 11, color: 'var(--muted)' }}>
                {route === 'dashboard' && 'Live state of the bot'}
                {route === 'chart' && '4h candles · Donchian / EMA / ADX overlays'}
                {route === 'trades' && 'Closed positions and outcomes'}
                {route === 'backtest' && 'Run strategy on historical data'}
                {route === 'strategy' && 'Read-only configuration & rules'}

            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>

          <main style={{ padding: '24px 28px 60px', maxWidth: 1480 }}>
            {screen}
          </main>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
